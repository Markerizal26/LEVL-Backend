name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql, pgsql, redis, zip, gd, bcmath, exif, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1

      - name: Validate Composer manifest
        run: composer validate --strict

      - name: Validate PHP syntax
        run: |
          find app Modules config routes bootstrap -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Run upload size tests
        run: |
          cp .env.example .env
          ./vendor/bin/pest tests/Unit/Support/ValidationRules/UploadSizeRuleTest.php --compact

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

  build:
    name: Build and Push Production Image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image_name.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image_name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image_name.outputs.image }}:${{ github.sha }}
            ${{ steps.image_name.outputs.image }}:main
          provenance: false
          sbom: false

  deploy:
    name: Deploy to Production Kubernetes
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify deploy start
        continue-on-error: true
        run: |
          bash .github/scripts/telegram.sh \
            "${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            "${{ secrets.TELEGRAM_CHAT_ID }}" \
            "🚀 LEVL production deployment started: ${GITHUB_SHA}"

      - name: Deploy image and manifests through SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60m
          command_timeout: 60m
          envs: IMAGE,DEPLOY_SHA
          script: |
            set -eu

            cd "${{ secrets.DEPLOY_PATH }}"

            # The SSH key used by this action logs into the VPS. The repository
            # itself is fetched from GitHub with the separate read-only key
            # provisioned on the VPS user.
            GITHUB_DEPLOY_KEY=/home/levl/.ssh/github_deploy
            test -r "$GITHUB_DEPLOY_KEY"
            export GIT_SSH_COMMAND="ssh -i $GITHUB_DEPLOY_KEY -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            SHORT_SHA=$(printf '%s' "$DEPLOY_SHA" | cut -c1-12)
            MIGRATION_JOB="levl-migrate-${SHORT_SHA}"
            K8S_TMP=$(mktemp -d)

            cleanup() {
              rm -rf "$K8S_TMP"
            }
            trap cleanup EXIT

            cp -R k8s/. "$K8S_TMP/"
            find "$K8S_TMP" -type f -name '*.yaml' -exec sed -i \
              -e "s#IMAGE_PLACEHOLDER#${IMAGE}#g" \
              -e "s#MIGRATION_JOB_NAME#${MIGRATION_JOB}#g" {} +

            KUBECTL="sudo k3s kubectl"

            $KUBECTL apply -f "$K8S_TMP/namespace.yaml"
            $KUBECTL apply -f "$K8S_TMP/configmap.yaml"
            $KUBECTL apply -f "$K8S_TMP/cluster-issuer.yaml"
            $KUBECTL apply -f "$K8S_TMP/media-pv.yaml"
            $KUBECTL apply -f "$K8S_TMP/media-pvc.yaml"
            $KUBECTL apply -f "$K8S_TMP/redis.yaml"

            $KUBECTL -n levl delete job -l app=levl-migrate --ignore-not-found
            $KUBECTL -n levl create -f "$K8S_TMP/migrate-job.yaml"
            $KUBECTL -n levl wait --for=condition=complete \
              "job/${MIGRATION_JOB}" --timeout=300s

            $KUBECTL apply -f "$K8S_TMP/app.yaml"
            $KUBECTL apply -f "$K8S_TMP/worker.yaml"
            $KUBECTL apply -f "$K8S_TMP/scheduler.yaml"
            $KUBECTL apply -f "$K8S_TMP/ingress.yaml"
            $KUBECTL apply -f "$K8S_TMP/certificate.yaml"

            $KUBECTL -n levl rollout status deployment/levl-app --timeout=300s
            $KUBECTL -n levl rollout status deployment/levl-queue --timeout=300s
            $KUBECTL -n levl wait --for=condition=Ready certificate/levl-ip --timeout=300s

            curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-connrefused \
              --output /dev/null --write-out 'health endpoint HTTP %{http_code}\n' \
              https://139.190.99.232/be/up

            sudo k3s crictl rmi --prune || true

            $KUBECTL -n levl get pods -o wide

      - name: Notify deploy success
        if: success()
        continue-on-error: true
        run: |
          bash .github/scripts/telegram.sh \
            "${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            "${{ secrets.TELEGRAM_CHAT_ID }}" \
            "✅ LEVL production deployment succeeded: ${GITHUB_SHA}"

      - name: Notify deploy failure
        if: failure()
        continue-on-error: true
        run: |
          bash .github/scripts/telegram.sh \
            "${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            "${{ secrets.TELEGRAM_CHAT_ID }}" \
            "❌ LEVL production deployment failed: ${GITHUB_SHA}"

  cleanup-registry:
    name: Delete Previous Images
    needs: deploy
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Keep only the current GHCR image version
        uses: actions/delete-package-versions@v5
        with:
          package-name: levl-backend
          package-type: container
          min-versions-to-keep: 1
          token: ${{ secrets.GITHUB_TOKEN }}
