apiVersion: batch/v1
kind: Job
metadata:
  name: MIGRATION_JOB_NAME
  namespace: levl
  labels:
    app: levl-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: levl-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: migrate
          image: IMAGE_PLACEHOLDER
          command: ["php", "artisan", "migrate", "--force"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          envFrom:
            - configMapRef:
                name: levl-config
            - secretRef:
                name: levl-env
