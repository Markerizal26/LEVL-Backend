apiVersion: apps/v1
kind: Deployment
metadata:
  name: levl-app
  namespace: levl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: levl-app
  template:
    metadata:
      labels:
        app: levl-app
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 33
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: levl-config
            - secretRef:
                name: levl-env
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "1280Mi"
          volumeMounts:
            - name: media-storage
              mountPath: /app/storage/app
          startupProbe:
            httpGet:
              path: /up
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /up
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: levl-media
---
apiVersion: v1
kind: Service
metadata:
  name: levl-app
  namespace: levl
spec:
  selector:
    app: levl-app
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
