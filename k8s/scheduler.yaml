apiVersion: batch/v1
kind: CronJob
metadata:
  name: levl-scheduler
  namespace: levl
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-auth
          containers:
            - name: scheduler
              image: IMAGE_PLACEHOLDER
              command: ["php", "artisan", "schedule:run"]
              envFrom:
                - configMapRef:
                    name: levl-config
                - secretRef:
                    name: levl-env
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "200m"
                  memory: "128Mi"
