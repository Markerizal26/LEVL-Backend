apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: levl-redis-data
  namespace: levl
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: levl-redis
  namespace: levl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: levl-redis
  template:
    metadata:
      labels:
        app: levl-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: levl-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: levl-redis
  namespace: levl
spec:
  selector:
    app: levl-redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
